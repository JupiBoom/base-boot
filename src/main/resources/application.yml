spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: root
    username: root
    url: jdbc:mysql://localhost:3306/base-boot?characterEncoding=UTF-8&useSSL=false&serverTimeZone=UTC&autoReconnect=true&allowMultiQueries=true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL5Dialect
  application:
    name: base-boot
  redis:
    host: localhost
    password: bdth-redis@2019
    port: 16379
management:
  endpoints:
    web:
      exposure:
        include: '*'
        exclude: ['shutdown']
  endpoint:
    health:
      show-details: always
base:
  boot:
    system:
      open-dynamic-data-source: true