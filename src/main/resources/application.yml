# InfluxDB配置
influxdb:
  url: http://localhost:8086
  username: admin
  password: admin
  database: iot_data

# MQTT Configuration
mqtt:
  broker: tcp://localhost:1883
  clientId: iot-data-collector
  username: 
  password: 
  topic: device/#
  qos: 1
  keepAliveInterval: 60

# Device Configuration
device:
  offlineThreshold: 300000 # 5分钟，单位毫秒



# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: '*'
        exclude: ['shutdown']
  endpoint:
    health:
      show-details: always
base:
  boot:
    system:
      open-dynamic-data-source: true